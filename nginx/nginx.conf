# GeoTech reverse proxy (runs inside the frontend container).
#
#   http://<SERVER_IP>/          -> React SPA (this container)
#   http://<SERVER_IP>/api/...  -> backend:8000/...  (prefix stripped)
#   http://<SERVER_IP>/docs     -> backend Swagger UI (testing convenience)
#   http://<SERVER_IP>/redoc,
#   http://<SERVER_IP>/openapi.json
#
# The backend has NO /api prefix of its own (routes are /auth, /users,
# /projects, ...), so /api/ is stripped before proxying:
#   /api/auth/login  ->  http://backend:8000/auth/login

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Signed work-order scans allow up to 15 MB, logos up to 5 MB.
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- Backend API (prefix stripped) ----
    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ---- Backend docs (testing convenience, same backend) ----
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- React SPA (must be LAST; try_files keeps refresh working) ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Long-cache fingerprinted Vite assets (safe: filenames contain hashes).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
